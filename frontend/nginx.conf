server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the backend Cloud Run service. Same-origin /api keeps
    # the session cookie first-party. ${BACKEND_URL} / ${BACKEND_HOST} are substituted
    # at container start by start-nginx.sh (envsubst), so the image is deploy-agnostic.
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host ${BACKEND_HOST};
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Content-hashed assets are immutable — cache them forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The SPA entrypoint must always revalidate so a redeploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA client routes fall back to index.html on hard refresh.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html /index.html;
    }
}
