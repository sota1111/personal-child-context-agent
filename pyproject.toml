[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-child-context-agent"
version = "0.1.0"
description = "Personal Child Context Agent — reconciles generic school information with a child's personal context. Same information. Different child. Different action."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "google-adk>=2.0,<3.0",
    "google-cloud-firestore>=2.16",
]

[project.optional-dependencies]
# Serving layer (SOT-2794): FastAPI backend deployed to Cloud Run. Kept optional so
# the core agent / tools / eval harness still install and test without the web stack.
serving = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]
# Real-document ingestion (SOT-2800). PDF text extraction is pure-python (CI-safe).
documents = [
    "pypdf>=4.0",
]
# Image / scanned-PDF OCR (SOT-2800). Needs the system tesseract + poppler binaries,
# so it is kept out of the default CI install; the pipeline uses an injectable engine.
ocr = [
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "pdf2image>=1.17",
]
# Cloud Vision OCR alternative (SOT-2800).
vision = [
    "google-cloud-vision>=3.7",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    # Include the serving stack so lint/typecheck/test cover the API layer in CI.
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    # PDF ingestion is pure-python, so exercise the real PDF path in CI.
    "pypdf>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["pcca"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
